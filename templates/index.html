<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenList 影视资源智能重命名</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #334155; --border: #475569;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #4ade80; --err: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  h1 span { color: var(--muted); font-size: 13px; font-weight: normal; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  label { color: var(--muted); font-size: 13px; }
  input, select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; transition: all .15s; }
  button:hover { background: #3b4b63; }
  button.primary { background: var(--accent); color: #0f172a; font-weight: bold; border: none; }
  button.primary:hover { background: #7dd3fc; }
  button.danger { background: #7f1d1d; color: #fecaca; border: none; }
  button.danger:hover { background: #991b1b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; position: sticky; top: 0; background: var(--panel); }
  tr:hover { background: var(--panel2); }
  td.old { color: var(--muted); text-decoration: line-through; }
  td.new { color: var(--ok); font-weight: bold; }
  .arrow { color: var(--accent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .badge.dir { background: #0c4a6e; color: #7dd3fc; }
  .badge.file { background: #374151; color: #9ca3af; }
  .badge.note { background: #451a03; color: #fdba74; }
  .badge.ok { background: #14532d; color: #86efac; }
  #log { background: #0b1120; border: 1px solid var(--border); border-radius: 6px; padding: 8px; height: 150px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  #log .err { color: var(--err); } #log .ok { color: var(--ok); } #log .warn { color: var(--warn); }
  .count { color: var(--muted); font-size: 12px; }
  #pathBar { flex: 1; min-width: 200px; }
  #mediaSelect { width: 100%; max-width: 480px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .mt { margin-top: 8px; }
  /* 来源 Tab */
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { padding: 6px 16px; border-radius: 6px 6px 0 0; border: 1px solid var(--border); border-bottom: none; background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); color: #0f172a; font-weight: bold; }
  .src-body { display: none; }
  .src-body.active { display: block; }
  .hint { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .scrape-tag { color: var(--ok); font-size: 12px; }
</style>
</head>
<body>

<h1>🎬 影视资源智能重命名 + 刮削 <span>多来源管理 · TMDB 匹配 · NFO/海报自动生成</span></h1>

<!-- 来源切换 -->
<div class="panel" style="padding-bottom:0">
  <div class="tabs">
    <div class="tab active" data-src="openlist" onclick="switchSrc('openlist')">🌐 OpenList 网盘</div>
    <div class="tab" data-src="fs" onclick="switchSrc('fs')">💾 NAS / 本地文件</div>
  </div>

  <!-- OpenList 连接 -->
  <div class="src-body active" id="body-openlist">
    <div class="row">
      <label>地址</label>
      <input id="base" style="width:220px" placeholder="http://192.168.x.x:5244">
      <label>账号</label>
      <input id="username" style="width:100px" value="admin">
      <label>密码</label>
      <input id="password" type="password" style="width:100px" value="admin">
      <button id="btnLogin" class="primary" onclick="login()">连接</button>
      <span id="connStatus" class="count">未连接</span>
    </div>
  </div>

  <!-- 本地文件 -->
  <div class="src-body" id="body-fs">
    <div class="row">
      <label>影视根目录</label>
      <span id="fsRoot" class="count">加载中...</span>
      <span class="hint">（Docker 挂载的 /media 目录，用 MEDIA_ROOT 环境变量可改）</span>
    </div>
  </div>
</div>

<!-- 目录导航 -->
<div class="panel">
  <div class="row">
    <label>目录</label>
    <input id="pathBar" value="/">
    <button onclick="listDir($('#pathBar').value)">进入</button>
    <button onclick="goUp()">上一级</button>
    <button onclick="listDir('/')">根目录</button>
    <button class="primary" style="background:#059669" onclick="batchAnalyze()">🔍 批量智能识别</button>
    <span id="batchStatus" class="count"></span>
  </div>
  <table id="dirTable">
    <thead><tr><th style="width:55%">名称</th><th style="width:10%">类型</th><th style="width:10%">大小</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- 批量识别结果 -->
<div class="panel" id="batchPanel" style="display:none">
  <div class="row">
    <strong>📋 批量识别结果</strong>
    <button class="primary" onclick="batchConfirm()">✅ 确认并生成方案</button>
    <button onclick="hideBatch()">关闭</button>
    <span class="hint">绿色=高置信 · 黄色=需确认 · 红色=未匹配（点行选择正确条目）</span>
  </div>
  <table id="batchTable">
    <thead><tr>
      <th style="width:28%">影视文件夹</th><th style="width:12%">置信度</th>
      <th style="width:35%">匹配结果</th><th style="width:25%">结构</th>
    </tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- 影视匹配 -->
<div class="panel">
  <div class="row">
    <label>真实影视名</label>
    <input id="titleQuery" style="width:200px" placeholder="如：狂飙 / The Godfather">
    <button class="primary" onclick="searchTMDB()">匹配 TMDB</button>
    <select id="mediaSelect"><option value="">（搜索后选择结果）</option></select>
    <label><input type="checkbox" id="includeYear" checked> 文件名含年份</label>
  </div>
  <div class="row">
    <button class="primary" onclick="makePlan()">生成改名方案</button>
    <span id="planCount" class="count"></span>
  </div>
</div>

<!-- 改名方案 -->
<div class="panel">
  <table id="planTable">
    <thead><tr>
      <th style="width:30px"><input type="checkbox" id="checkAll" checked onclick="toggleAll(this)"></th>
      <th style="width:30%">原名</th><th style="width:4%"></th><th style="width:30%">新名</th><th>说明</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <div class="row mt">
    <label><input type="checkbox" id="scrapeChk" checked> 重命名后自动刮削</label>
    <span id="scrapeHint" class="hint"></span>
    <button id="btnRename" class="danger" onclick="doRename()">执行重命名</button>
    <button id="btnScrape" class="primary" style="background:#059669" onclick="doScrape()">执行刮削</button>
    <span class="count">⚠ 直接修改文件名，不可撤销</span>
  </div>
</div>

<!-- 日志 -->
<div class="panel">
  <div id="log">欢迎使用。选择来源 → 进入影视目录 → 输入真实影视名匹配 → 生成方案 → 执行。<br></div>
</div>

<script>
const $ = s => document.querySelector(s);
let currentSrc = 'openlist';
let currentPath = '/';
let plans = [];
let selectedMedia = null;

function log(msg, cls='') {
  const div = $('#log');
  div.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  div.scrollTop = div.scrollHeight;
}

async function api(url, opts={}) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (!d.ok) throw new Error(d.msg || '请求失败');
  return d;
}

// ---------- 来源切换 ----------
function switchSrc(src) {
  currentSrc = src;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.src === src));
  document.querySelectorAll('.src-body').forEach(b => b.classList.toggle('active', b.id === 'body-' + src));
  if (src === 'fs') checkFsRoot();
  // 刮削只对 fs 来源有效（OpenList v3 上传 API 兼容性问题）
  $('#scrapeChk').disabled = (src !== 'fs');
  $('#btnScrape').disabled = (src !== 'fs');
  if (src !== 'fs') {
    $('#scrapeChk').checked = false;
    $('#scrapeHint').textContent = '（OpenList 来源不支持写入文件 → 刮削已禁用）';
  } else {
    $('#scrapeHint').textContent = '（重命名后自动生成 NFO + 海报）';
  }
  listDir('/');
}

async function checkFsRoot() {
  try {
    const d = await api('/api/fs/roots');
    $('#fsRoot').textContent = d.exists ? `✅ ${d.root}（已挂载）` : `❌ ${d.root}（未挂载）`;
  } catch(e) {
    $('#fsRoot').textContent = '查询失败';
  }
}

function connOK() {
  if (currentSrc === 'fs') return true;
  return $('#connStatus').textContent !== '未连接';
}

// ---------- 连接 ----------
async function login() {
  $('#btnLogin').disabled = true;
  try {
    const d = await api('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({base: $('#base').value, username: $('#username').value, password: $('#password').value})
    });
    $('#connStatus').textContent = `已连接 ${d.base}`;
    log('✅ 连接成功', 'ok');
    await listDir('/');
  } catch(e) {
    $('#connStatus').textContent = '连接失败';
    log('❌ ' + e.message, 'err');
  }
  $('#btnLogin').disabled = false;
}

// ---------- 目录 ----------
async function listDir(path) {
  if (!connOK()) { log('请先连接 OpenList', 'err'); return; }
  try {
    const d = await api('/api/list?src=' + currentSrc + '&path=' + encodeURIComponent(path));
    currentPath = d.path;
    $('#pathBar').value = d.path;
    const tbody = $('#dirTable tbody');
    tbody.innerHTML = '';
    for (const it of d.items) {
      const tr = document.createElement('tr');
      const badge = it.is_dir ? '<span class="badge dir">目录</span>' : '<span class="badge file">文件</span>';
      const size = it.is_dir ? '' : fmtSize(it.size);
      const act = it.is_dir
        ? `<button onclick="listDir('${(d.path==='/'?'':d.path)+'/'+escAttr(it.name)}')">打开</button>`
        : '';
      tr.innerHTML = `<td>${esc(it.name)}</td><td>${badge}</td><td class="count">${size}</td><td>${act}</td>`;
      tbody.appendChild(tr);
    }
    log(`📂 [${currentSrc}] ${d.path}（${d.items.length} 项）`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}
function goUp() {
  const p = currentPath;
  if (p === '/') return;
  listDir(p.substring(0, p.lastIndexOf('/')) || '/');
}
function fmtSize(n) {
  if (!n) return '';
  if (n > 1073741824) return (n/1073741824).toFixed(1) + ' GB';
  if (n > 1048576) return (n/1048576).toFixed(1) + ' MB';
  return Math.round(n/1024) + ' KB';
}

// ---------- TMDB ----------
async function searchTMDB() {
  const q = $('#titleQuery').value.trim();
  if (!q) { log('请输入影视名', 'err'); return; }
  try {
    const d = await api('/api/search?q=' + encodeURIComponent(q));
    const sel = $('#mediaSelect');
    sel.innerHTML = '';
    for (const r of d.results) {
      const o = document.createElement('option');
      o.value = JSON.stringify(r);
      o.textContent = r.label;
      sel.appendChild(o);
    }
    selectedMedia = d.results[0] || null;
    log(`🔍 找到 ${d.results.length} 个结果，请选择正确的`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

// ---------- 方案 ----------
async function makePlan() {
  if (!connOK()) { log('请先连接', 'err'); return; }
  const sel = $('#mediaSelect');
  if (!sel.value) { log('请先匹配并选择影视', 'err'); return; }
  let media;
  try { media = JSON.parse(sel.value); } catch(e) { log('选择无效', 'err'); return; }
  selectedMedia = media;
  try {
    const d = await api('/api/plan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, path: currentPath, media, include_year: $('#includeYear').checked})
    });
    plans = d.plans;
    const tbody = $('#planTable tbody');
    tbody.innerHTML = '';
    if (!plans.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">没有可重命名的项</td></tr>';
    }
    for (const p of plans) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="checkbox" class="planChk" checked></td>
        <td class="old">${esc(p.src_name)}</td><td class="arrow">→</td>
        <td class="new">${esc(p.new_name)}</td><td><span class="badge note">${esc(p.note)}</span></td>`;
      tbody.appendChild(tr);
    }
    $('#planCount').textContent = `共 ${plans.length} 项可重命名（共 ${d.total} 项）`;
    log(`📋 生成方案：${plans.length} 项`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

function toggleAll(cb) {
  document.querySelectorAll('.planChk').forEach(c => c.checked = cb.checked);
}

// ---------- 执行 ----------
async function doRename() {
  if (!plans.length) { log('没有方案', 'err'); return; }
  // 批量方案（每项带自己的 media）或单影视方案（用 selectedMedia）
  const hasBatchMedia = plans.some(p => p.media && p.media.id);
  if (!hasBatchMedia && !selectedMedia) { log('请先选择影视', 'err'); return; }
  const checked = [...document.querySelectorAll('.planChk')].map(c => c.checked);
  const targets = plans.filter((_, i) => checked[i]);
  if (!targets.length) { log('没有勾选任何项', 'err'); return; }
  if (!confirm(`确定重命名 ${targets.length} 个资源吗？\n该操作会直接修改${currentSrc === 'fs' ? '本地/NAS 文件' : '网盘资源'}名！`)) return;
  try {    const d = await api('/api/rename', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, items: targets, scrape: $('#scrapeChk').checked})
    });
    log(`✅ 重命名完成：成功 ${d.success}/${d.total}`, 'ok');
    if (d.scrape && d.scrape.length) {
      for (const s of d.scrape) {
        if (s.ok) log(`  🖼 刮削 ${s.path} → ${s.files.join(', ')}`, 'ok');
        else log(`  ⚠ 刮削 ${s.path}: ${s.msg}`, 'warn');
      }
    }
    if (d.success) await listDir(currentPath);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

// ---------- 批量智能识别（自动扫描+匹配+确认）----------
let batchResults = [];

async function batchAnalyze() {
  if (!connOK()) { log('请先连接', 'err'); return; }
  $('#batchStatus').textContent = '识别中...';
  try {
    const d = await api('/api/batch-analyze', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, path: currentPath, include_year: $('#includeYear').checked})
    });
    batchResults = d.results;
    renderBatch();
    $('#batchPanel').style.display = 'block';
    $('#batchStatus').textContent = `共 ${d.total} 部影视`;
    const hi = d.results.filter(r => r.confidence === 'hi').length;
    const mid = d.results.filter(r => r.confidence === 'mid').length;
    const low = d.results.filter(r => r.confidence === 'low' || !r.matched).length;
    log(`🔍 批量识别完成：${d.total} 部（高置信 ${hi} / 需确认 ${mid} / 未匹配 ${low}）`, 'ok');
  } catch(e) {
    $('#batchStatus').textContent = '';
    log('❌ ' + e.message, 'err');
  }
}

function renderBatch() {
  const tbody = $('#batchTable tbody');
  tbody.innerHTML = '';
  for (let i = 0; i < batchResults.length; i++) {
    const r = batchResults[i];
    const confTxt = {'hi': '✅ 高', 'mid': '🟡 中', 'low': '❌ 低'}[r.confidence] || '❌';
    const confCls = {'hi': 'ok', 'mid': 'warn', 'low': 'err'}[r.confidence] || 'err';
    const matchTxt = r.matched
      ? `${r.media.name} (${r.media.year}) [${r.media.media_type === 'tv' ? '剧集' : '电影'}]`
      : `未匹配（自动提取: ${r.query || '-'}）`;
    const struct = r.structure.season_dirs.length
      ? `${r.structure.season_dirs.length} 季 + ${r.structure.top_video_count} 集`
      : `${r.structure.top_video_count} 个视频`;
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${esc(r.name)}</td>
      <td class="${confCls}">${confTxt}</td>
      <td>${esc(matchTxt)}</td>
      <td class="count">${struct}</td>`;
    tr.style.cursor = 'pointer';
    tr.title = '点击展开/选择正确匹配';
    tr.onclick = () => batchPick(i);
    tbody.appendChild(tr);
  }
  // 检测同剧多季分组（合并建议）
  detectMergeGroups();
}

// ---------- 同剧多季合并检测 ----------
function normName(s) {
  if (!s) return '';
  // 去掉 Ⅱ/II/2季/第二季 等季标识，归一化
  return s.replace(/[ⅡIⅠ2２]/g, '')
          .replace(/[·・]?第\s*[一二三四五六七八九十\d]+\s*季/g, '')
          .replace(/\s+/g, '').toLowerCase();
}

function detectMergeGroups() {
  const groups = [];
  const seen = {};
  for (const r of batchResults) {
    if (!r.matched || r.media.media_type !== 'tv') continue;
    const key = normName(r.media.name);
    if (!key || key.length < 2) continue;
    if (!seen[key]) { seen[key] = []; groups.push(seen[key]); }
    seen[key].push(r);
  }
  // 找同剧 ≥2 个文件夹的组
  const mergeable = groups.filter(g => g.length >= 2);
  const old = document.getElementById('mergeBar');
  if (old) old.remove();
  if (!mergeable.length) return;

  const bar = document.createElement('div');
  bar.id = 'mergeBar';
  bar.style.cssText = 'margin-top:10px;padding:10px;background:#064e3b;border:1px solid #059669;border-radius:6px;';
  let html = '<strong style="color:#34d399">🔀 检测到同剧多季（可合并为一个文件夹）</strong><br>';
  for (const g of mergeable) {
    const mainName = g[0].media.name + ' (' + g[0].media.year + ')';
    const parts = g.map((r, idx) => {
      const seasonHint = guessSeasonFromName(r.name, idx);
      return `"${esc(r.name)}"→季${seasonHint}`;
    }).join('，');
    html += `<div style="margin-top:6px">
      <span style="color:#a7f3d0">${esc(mainName)}</span>
      <span class="count">：${parts}</span>
      <button style="margin-left:8px;background:#059669;color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer"
        onclick="doMerge([${g.map(r => `'${r.src_path.replace(/'/g, "\\'")}'`).join(',')}], '${escAttr(mainName)}', [${g.map((r, idx) => guessSeasonFromName(r.name, idx)).join(',')}])">合并</button>
    </div>`;
  }
  bar.innerHTML = html;
  document.getElementById('batchPanel').insertBefore(bar, $('#batchTable').nextSibling);
}

function guessSeasonFromName(name, fallbackIdx) {
  // 从文件夹名提取季号：含 Ⅱ/II/2/第二季 → 2
  const n = name || '';
  if (/[ⅡIⅠ2２]/.test(n) || /第\s*[二2]\s*季/.test(n)) return 2;
  if (/[Ⅲ3３]/.test(n) || /第\s*[三3]\s*季/.test(n)) return 3;
  if (/[Ⅳ4４]/.test(n) || /第\s*[四4]\s*季/.test(n)) return 4;
  if (/Season\s*(\d+)/i.test(n)) return parseInt(n.match(/Season\s*(\d+)/i)[1]);
  return fallbackIdx + 1; // 默认按顺序
}

async function doMerge(srcPaths, totalName, seasonHints) {
  const items = srcPaths.map((p, i) => ({src_path: p, season_hint: seasonHints[i], display_name: totalName}));
  if (!confirm(`确认合并为「${totalName}」？\n${items.map((it, i) => `${i+1}. ${it.src_path.split('/').pop()} → Season ${it.season_hint}`).join('\n')}\n\n⚠ 会移动文件！`)) return;
  try {
    const d = await api('/api/tv-merge', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, items, total_name: totalName})
    });
    if (d.ok) {
      log(`✅ 合并完成：${d.total_path}`, 'ok');
      if (d.ops) for (const o of d.ops.slice(0, 10)) log(`  ↳ ${o}`, 'ok');
      await listDir(currentPath);
      hideBatch();
    } else {
      log('❌ ' + d.msg, 'err');
    }
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

async function batchPick(idx) {
  const r = batchResults[idx];
  if (!r.matched) {
    // 未匹配：让用户手动输入搜索
    const q = prompt('未自动匹配。输入正确影视名搜索：', r.query || '');
    if (!q) return;
    try {
      const d = await api('/api/search?q=' + encodeURIComponent(q));
      if (!d.results.length) { alert('无结果'); return; }
      const labels = d.results.map((x, i) => `${i+1}. ${x.label}`);
      const pick = prompt('选择正确条目（输入编号）：\n' + labels.join('\n'));
      const idx2 = parseInt(pick) - 1;
      if (isNaN(idx2) || idx2 < 0 || idx2 >= d.results.length) { alert('无效选择'); return; }
      const m = d.results[idx2];
      batchResults[idx].media = m;
      batchResults[idx].matched = true;
      batchResults[idx].confidence = 'mid';
      renderBatch();
    } catch(e) { alert('搜索失败: ' + e.message); }
  } else {
    // 已匹配：可选更换
    const q = prompt(`当前: ${r.media.name} (${r.media.year})\n如匹配正确直接回车跳过，否则输入新搜索词：`, r.media.name);
    if (!q || q === r.media.name) return;
    try {
      const d = await api('/api/search?q=' + encodeURIComponent(q));
      if (!d.results.length) { alert('无结果'); return; }
      const labels = d.results.map((x, i) => `${i+1}. ${x.label}`);
      const pick = prompt('选择正确条目（输入编号）：\n' + labels.join('\n'));
      const idx2 = parseInt(pick) - 1;
      if (isNaN(idx2) || idx2 < 0 || idx2 >= d.results.length) { alert('无效选择'); return; }
      batchResults[idx].media = d.results[idx2];
      batchResults[idx].confidence = 'mid';
      renderBatch();
    } catch(e) { alert('搜索失败: ' + e.message); }
  }
}

async function batchConfirm() {
  // 收集已匹配的条目 → 生成方案
  const matched = batchResults.filter(r => r.matched);
  if (!matched.length) { alert('没有已匹配的影视，请先修正'); return; }
  // 对每个匹配条目生成方案（复用 api/plan 逻辑：传入当前分类路径）
  let allPlans = [];
  for (const r of matched) {
    try {
      const d = await api('/api/plan', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({src: currentSrc, path: r.src_path, media: r.media, include_year: $('#includeYear').checked})
      });
      for (const p of d.plans) {
        // 每项附带自己的 media（供刮削用正确影视信息）
        allPlans.push({...p, batchSrc: r.name, media: r.media});
      }
    } catch(e) { log(`⚠ ${r.name}: ${e.message}`, 'warn'); }
  }
  plans = allPlans;
  // 渲染到方案表
  const tbody = $('#planTable tbody');
  tbody.innerHTML = '';
  if (!plans.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">没有可重命名的项</td></tr>';
  }
  for (const p of plans) {
    const tr = document.createElement('tr');
    const tag = p.batchSrc ? `<span class="badge dir">${esc(p.batchSrc)}</span> ` : '';
    tr.innerHTML = `<td><input type="checkbox" class="planChk" checked></td>
      <td class="old">${tag}${esc(p.src_name)}</td><td class="arrow">→</td>
      <td class="new">${esc(p.new_name)}</td><td><span class="badge note">${esc(p.note)}</span></td>`;
    tbody.appendChild(tr);
  }
  $('#planCount').textContent = `批量共 ${plans.length} 项可重命名`;
  log(`📋 批量生成方案：${plans.length} 项（来自 ${matched.length} 部影视）`, 'ok');
  $('#batchPanel').style.display = 'none';
  $('#batchStatus').textContent = '';
  // 滚动到方案表
  document.querySelector('#planTable').scrollIntoView({behavior: 'smooth'});
}

function hideBatch() {
  $('#batchPanel').style.display = 'none';
  $('#batchStatus').textContent = '';
}

// ---------- 独立刮削（不改文件名，只生成 NFO/海报）----------
async function doScrape() {
  if (!connOK()) { log('请先连接', 'err'); return; }
  if (currentSrc !== 'fs') { log('刮削仅支持 NAS/本地来源（OpenList 不支持写文件）', 'err'); return; }
  if (!selectedMedia) { log('请先匹配 TMDB 选择影视', 'err'); return; }
  if (!confirm(`对当前目录「${currentPath}」执行刮削吗？\n将生成：tvshow.nfo / movie.nfo + poster.jpg + fanart.jpg（不改文件名）`)) return;
  $('#btnScrape').disabled = true;
  try {
    const d = await api('/api/scrape', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, path: currentPath, media: selectedMedia})
    });
    log(`🖼 刮削成功：${d.files.join(', ')}`, 'ok');
    log(`   标题：${d.title} (${d.year})`, 'ok');
    await listDir(currentPath);
  } catch(e) {
    log('❌ ' + e.message, 'err');
  }
  $('#btnScrape').disabled = false;
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// 默认值
$('#base').value = '{{ default_ol }}';
$('#username').value = '{{ default_user }}';
$('#password').value = '{{ default_pass }}';
</script>
