<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenList 影视资源智能重命名</title>
<style>
  :root {
    --bg: #0f172a; --panel: #1e293b; --panel2: #334155; --border: #475569;
    --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --ok: #4ade80; --err: #f87171;
    --warn: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  h1 span { color: var(--muted); font-size: 13px; font-weight: normal; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  label { color: var(--muted); font-size: 13px; }
  input, select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; transition: all .15s; }
  button:hover { background: #3b4b63; }
  button.primary { background: var(--accent); color: #0f172a; font-weight: bold; border: none; }
  button.primary:hover { background: #7dd3fc; }
  button.danger { background: #7f1d1d; color: #fecaca; border: none; }
  button.danger:hover { background: #991b1b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; position: sticky; top: 0; background: var(--panel); }
  tr:hover { background: var(--panel2); }
  td.old { color: var(--muted); text-decoration: line-through; }
  td.new { color: var(--ok); font-weight: bold; }
  .arrow { color: var(--accent); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .badge.dir { background: #0c4a6e; color: #7dd3fc; }
  .badge.file { background: #374151; color: #9ca3af; }
  .badge.note { background: #451a03; color: #fdba74; }
  .badge.ok { background: #14532d; color: #86efac; }
  #log { background: #0b1120; border: 1px solid var(--border); border-radius: 6px; padding: 8px; height: 150px; overflow-y: auto; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  #log .err { color: var(--err); } #log .ok { color: var(--ok); } #log .warn { color: var(--warn); }
  .count { color: var(--muted); font-size: 12px; }
  #pathBar { flex: 1; min-width: 200px; }
  #mediaSelect { width: 100%; max-width: 480px; }
  .inline { display: flex; gap: 8px; align-items: center; }
  .mt { margin-top: 8px; }
  /* 来源 Tab */
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tab { padding: 6px 16px; border-radius: 6px 6px 0 0; border: 1px solid var(--border); border-bottom: none; background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); color: #0f172a; font-weight: bold; }
  .src-body { display: none; }
  .src-body.active { display: block; }
  .hint { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .scrape-tag { color: var(--ok); font-size: 12px; }
</style>
</head>
<body>

<h1>🎬 影视资源智能重命名 + 刮削 <span>多来源管理 · TMDB 匹配 · NFO/海报自动生成</span></h1>

<!-- 来源切换 -->
<div class="panel" style="padding-bottom:0">
  <div class="tabs">
    <div class="tab active" data-src="openlist" onclick="switchSrc('openlist')">🌐 OpenList 网盘</div>
    <div class="tab" data-src="fs" onclick="switchSrc('fs')">💾 NAS / 本地文件</div>
  </div>

  <!-- OpenList 连接 -->
  <div class="src-body active" id="body-openlist">
    <div class="row">
      <label>地址</label>
      <input id="base" style="width:220px" placeholder="http://192.168.x.x:5244">
      <label>账号</label>
      <input id="username" style="width:100px" value="admin">
      <label>密码</label>
      <input id="password" type="password" style="width:100px" value="admin">
      <button id="btnLogin" class="primary" onclick="login()">连接</button>
      <span id="connStatus" class="count">未连接</span>
    </div>
  </div>

  <!-- 本地文件 -->
  <div class="src-body" id="body-fs">
    <div class="row">
      <label>影视根目录</label>
      <span id="fsRoot" class="count">加载中...</span>
      <span class="hint">（Docker 挂载的 /media 目录，用 MEDIA_ROOT 环境变量可改）</span>
    </div>
  </div>
</div>

<!-- 目录导航 -->
<div class="panel">
  <div class="row">
    <label>目录</label>
    <input id="pathBar" value="/">
    <button onclick="listDir($('#pathBar').value)">进入</button>
    <button onclick="goUp()">上一级</button>
    <button onclick="listDir('/')">根目录</button>
  </div>
  <table id="dirTable">
    <thead><tr><th style="width:55%">名称</th><th style="width:10%">类型</th><th style="width:10%">大小</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- 影视匹配 -->
<div class="panel">
  <div class="row">
    <label>真实影视名</label>
    <input id="titleQuery" style="width:200px" placeholder="如：狂飙 / The Godfather">
    <button class="primary" onclick="searchTMDB()">匹配 TMDB</button>
    <select id="mediaSelect"><option value="">（搜索后选择结果）</option></select>
    <label><input type="checkbox" id="includeYear" checked> 文件名含年份</label>
  </div>
  <div class="row">
    <button class="primary" onclick="makePlan()">生成改名方案</button>
    <span id="planCount" class="count"></span>
  </div>
</div>

<!-- 改名方案 -->
<div class="panel">
  <table id="planTable">
    <thead><tr>
      <th style="width:30px"><input type="checkbox" id="checkAll" checked onclick="toggleAll(this)"></th>
      <th style="width:30%">原名</th><th style="width:4%"></th><th style="width:30%">新名</th><th>说明</th>
    </tr></thead>
    <tbody></tbody>
  </table>
  <div class="row mt">
    <label><input type="checkbox" id="scrapeChk" checked> 重命名后自动刮削（生成 NFO + 海报）</label>
    <button class="danger" onclick="doRename()">执行重命名</button>
    <span class="count">⚠ 直接修改文件名，不可撤销</span>
  </div>
</div>

<!-- 日志 -->
<div class="panel">
  <div id="log">欢迎使用。选择来源 → 进入影视目录 → 输入真实影视名匹配 → 生成方案 → 执行。<br></div>
</div>

<script>
const $ = s => document.querySelector(s);
let currentSrc = 'openlist';
let currentPath = '/';
let plans = [];
let selectedMedia = null;

function log(msg, cls='') {
  const div = $('#log');
  div.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  div.scrollTop = div.scrollHeight;
}

async function api(url, opts={}) {
  const r = await fetch(url, opts);
  const d = await r.json();
  if (!d.ok) throw new Error(d.msg || '请求失败');
  return d;
}

// ---------- 来源切换 ----------
function switchSrc(src) {
  currentSrc = src;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.src === src));
  document.querySelectorAll('.src-body').forEach(b => b.classList.toggle('active', b.id === 'body-' + src));
  if (src === 'fs') checkFsRoot();
  listDir('/');
}

async function checkFsRoot() {
  try {
    const d = await api('/api/fs/roots');
    $('#fsRoot').textContent = d.exists ? `✅ ${d.root}（已挂载）` : `❌ ${d.root}（未挂载）`;
  } catch(e) {
    $('#fsRoot').textContent = '查询失败';
  }
}

function connOK() {
  if (currentSrc === 'fs') return true;
  return $('#connStatus').textContent !== '未连接';
}

// ---------- 连接 ----------
async function login() {
  $('#btnLogin').disabled = true;
  try {
    const d = await api('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({base: $('#base').value, username: $('#username').value, password: $('#password').value})
    });
    $('#connStatus').textContent = `已连接 ${d.base}`;
    log('✅ 连接成功', 'ok');
    await listDir('/');
  } catch(e) {
    $('#connStatus').textContent = '连接失败';
    log('❌ ' + e.message, 'err');
  }
  $('#btnLogin').disabled = false;
}

// ---------- 目录 ----------
async function listDir(path) {
  if (!connOK()) { log('请先连接 OpenList', 'err'); return; }
  try {
    const d = await api('/api/list?src=' + currentSrc + '&path=' + encodeURIComponent(path));
    currentPath = d.path;
    $('#pathBar').value = d.path;
    const tbody = $('#dirTable tbody');
    tbody.innerHTML = '';
    for (const it of d.items) {
      const tr = document.createElement('tr');
      const badge = it.is_dir ? '<span class="badge dir">目录</span>' : '<span class="badge file">文件</span>';
      const size = it.is_dir ? '' : fmtSize(it.size);
      const act = it.is_dir
        ? `<button onclick="listDir('${(d.path==='/'?'':d.path)+'/'+escAttr(it.name)}')">打开</button>`
        : '';
      tr.innerHTML = `<td>${esc(it.name)}</td><td>${badge}</td><td class="count">${size}</td><td>${act}</td>`;
      tbody.appendChild(tr);
    }
    log(`📂 [${currentSrc}] ${d.path}（${d.items.length} 项）`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}
function goUp() {
  const p = currentPath;
  if (p === '/') return;
  listDir(p.substring(0, p.lastIndexOf('/')) || '/');
}
function fmtSize(n) {
  if (!n) return '';
  if (n > 1073741824) return (n/1073741824).toFixed(1) + ' GB';
  if (n > 1048576) return (n/1048576).toFixed(1) + ' MB';
  return Math.round(n/1024) + ' KB';
}

// ---------- TMDB ----------
async function searchTMDB() {
  const q = $('#titleQuery').value.trim();
  if (!q) { log('请输入影视名', 'err'); return; }
  try {
    const d = await api('/api/search?q=' + encodeURIComponent(q));
    const sel = $('#mediaSelect');
    sel.innerHTML = '';
    for (const r of d.results) {
      const o = document.createElement('option');
      o.value = JSON.stringify(r);
      o.textContent = r.label;
      sel.appendChild(o);
    }
    selectedMedia = d.results[0] || null;
    log(`🔍 找到 ${d.results.length} 个结果，请选择正确的`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

// ---------- 方案 ----------
async function makePlan() {
  if (!connOK()) { log('请先连接', 'err'); return; }
  const sel = $('#mediaSelect');
  if (!sel.value) { log('请先匹配并选择影视', 'err'); return; }
  let media;
  try { media = JSON.parse(sel.value); } catch(e) { log('选择无效', 'err'); return; }
  selectedMedia = media;
  try {
    const d = await api('/api/plan', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, path: currentPath, media, include_year: $('#includeYear').checked})
    });
    plans = d.plans;
    const tbody = $('#planTable tbody');
    tbody.innerHTML = '';
    if (!plans.length) {
      tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted)">没有可重命名的项</td></tr>';
    }
    for (const p of plans) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><input type="checkbox" class="planChk" checked></td>
        <td class="old">${esc(p.src_name)}</td><td class="arrow">→</td>
        <td class="new">${esc(p.new_name)}</td><td><span class="badge note">${esc(p.note)}</span></td>`;
      tbody.appendChild(tr);
    }
    $('#planCount').textContent = `共 ${plans.length} 项可重命名（共 ${d.total} 项）`;
    log(`📋 生成方案：${plans.length} 项`);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

function toggleAll(cb) {
  document.querySelectorAll('.planChk').forEach(c => c.checked = cb.checked);
}

// ---------- 执行 ----------
async function doRename() {
  if (!plans.length) { log('没有方案', 'err'); return; }
  if (!selectedMedia) { log('请先选择影视', 'err'); return; }
  const checked = [...document.querySelectorAll('.planChk')].map(c => c.checked);
  const targets = plans.filter((_, i) => checked[i]);
  if (!targets.length) { log('没有勾选任何项', 'err'); return; }
  if (!confirm(`确定重命名 ${targets.length} 个资源吗？\n该操作会直接修改${currentSrc === 'fs' ? '本地/NAS 文件' : '网盘资源'}名！`)) return;
  try {
    const d = await api('/api/rename', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({src: currentSrc, items: targets, scrape: $('#scrapeChk').checked})
    });
    log(`✅ 重命名完成：成功 ${d.success}/${d.total}`, 'ok');
    if (d.scrape && d.scrape.length) {
      for (const s of d.scrape) {
        if (s.ok) log(`  🖼 刮削 ${s.path} → ${s.files.join(', ')}`, 'ok');
        else log(`  ⚠ 刮削 ${s.path}: ${s.msg}`, 'warn');
      }
    }
    if (d.success) await listDir(currentPath);
  } catch(e) { log('❌ ' + e.message, 'err'); }
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}
function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// 默认值
$('#base').value = '{{ default_ol }}';
$('#username').value = '{{ default_user }}';
$('#password').value = '{{ default_pass }}';
</script>
</body>
</html>
